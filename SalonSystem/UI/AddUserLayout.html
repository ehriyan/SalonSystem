<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f6f9;
            padding: 25px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            color: #293541;
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #7f8c8d;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

            input:focus, select:focus {
                border-color: #3498db;
                outline: none;
            }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-save {
            flex: 1;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

            .btn-save:hover {
                background-color: #27ae60;
            }

        .btn-cancel {
            flex: 1;
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

            .btn-cancel:hover {
                background-color: #c0392b;
            }

        .role-display {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 600;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Create User Account</h2>

        <div class="form-group">
            <label>Select Employee</label>
            <select id="cmbEmployee" onchange="updateRoleDisplay()"></select>
        </div>

        <div class="form-group">
            <label>Assigned Role</label>
  
            <span id="displayRole" class="role-display">Select an employee...</span>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="txtUsername" placeholder="Enter username">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="txtPassword" placeholder="Enter password">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="txtEmail" placeholder="employee@salon.com">
        </div>

        <div class="btn-group">
            <button class="btn-cancel" onclick="cancel()">Cancel</button>
            <button class="btn-save" onclick="save()">Save Account</button>
        </div>
    </div>

    <script>
        let employeeData = [];
        let currentRole = "";

        window.chrome.webview.addEventListener('message', event => {
            employeeData = event.data;
            const cmb = document.getElementById('cmbEmployee');
            cmb.innerHTML = '<option value="">-- Select an Employee --</option>';

            employeeData.forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = emp.name;
                cmb.appendChild(opt);
            });
        });

        function updateRoleDisplay() {
            const selectedId = document.getElementById('cmbEmployee').value;
            const emp = employeeData.find(e => e.id == selectedId);
            const display = document.getElementById('displayRole');

            if (emp) {
                currentRole = emp.role;
                display.textContent = emp.role;
            } else {
                currentRole = "";
                display.textContent = "Select an employee...";
            }
        }

        function save() {
            const empId = document.getElementById('cmbEmployee').value;
            const user = document.getElementById('txtUsername').value.trim();
            const pass = document.getElementById('txtPassword').value.trim();
            const email = document.getElementById('txtEmail').value.trim();

            if (!empId || !user || !pass) {
                alert("Please fill in all required fields.");
                return;
            }

            const payload = `SAVE|||${empId}|||${user}|||${pass}|||${email}|||${currentRole}`;
            window.chrome.webview.postMessage(payload);
        }

        function cancel() { window.chrome.webview.postMessage('CANCEL'); }
    </script>
</body>
</html>
